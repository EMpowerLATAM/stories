<style>
:root {
  color-scheme: only light;
  --navy: #002257; --blue: #005794; --yellow: #FFC955; --coral: #FC7366;
  --muted: #55647A; --line: rgba(0, 34, 87, .12); --beige: #F3EDE2;
  --head: "Bricolage Grotesque", "Trebuchet MS", "Noto Sans Devanagari", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", "Noto Sans Devanagari", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { scroll-behavior: smooth }
body { margin: 0; overflow-x: hidden; background: #fff; color: var(--navy); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased }
a { color: var(--blue) } a:hover { color: var(--navy) }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px }
::selection { background: var(--yellow); color: var(--navy) }
h1, h2, h3 { font-family: var(--head); margin: 0; text-wrap: balance }
.hl { background: linear-gradient(transparent 62%, rgba(255, 201, 85, .9) 62%, rgba(255, 201, 85, .9) 92%, transparent 92%) }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 200; background: var(--navy); color: #fff; padding: .6rem 1rem; border-radius: 8px; font-weight: 700; text-decoration: none }
.skip:focus { left: 12px; color: #fff }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 32px }

/* Header */
.top { position: absolute; inset: 0 0 auto; z-index: 30 }
.top-in { max-width: 1400px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px }
.top img { height: 46px; width: auto; display: block }
.top nav { display: flex; align-items: center; gap: 26px }
.cue-link { color: #fff; text-decoration: none; font-weight: 700; font-size: .95rem; box-shadow: inset 0 -2px 0 transparent; transition: box-shadow .2s }
.cue-link:hover { color: #fff; box-shadow: inset 0 -2px 0 var(--yellow) }
.lang-switch { display: flex; flex-wrap: wrap; justify-content: flex-end; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: #fff }
.lang-switch button { font: inherit; font-size: .8rem; font-weight: 700; border: 0; background: none; color: var(--navy); padding: .3rem .55rem; border-radius: 999px; cursor: pointer }
.lang-switch button[aria-pressed="true"] { background: var(--yellow) }
.lang-select { display: none; font: inherit; font-weight: 700; color: var(--navy); border: 1.5px solid var(--line); border-radius: 999px; padding: .35rem .7rem; background: #fff }

/* Hero + map */
.hero { position: relative; color: #fff; background: linear-gradient(160deg, #001a45 0%, #002257 40%, #004477 100%); overflow: hidden }
.hero-in { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 32px; padding: 120px 32px 56px; align-items: center }
.intro { display: flex; flex-direction: column; gap: 22px }
.kicker { font-weight: 700; text-transform: uppercase; font-size: .76rem; letter-spacing: .14em; color: var(--yellow) }
.intro h1 { font-weight: 800; font-size: clamp(2.6rem, 5.2vw, 5rem); line-height: .98; letter-spacing: -.04em }
.intro p { margin: 0; color: rgba(255, 255, 255, .82); font-size: 1.08rem; max-width: 44ch; text-wrap: pretty }
.stats { display: flex; flex-wrap: wrap; gap: 22px 34px; margin-top: 6px }
.stat { display: flex; flex-direction: column; gap: 2px }
.stat b { font-family: var(--head); font-weight: 800; font-size: clamp(2rem, 3.2vw, 2.9rem); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.stat span { font-size: .9rem; color: rgba(255, 255, 255, .75) }
.map-wrap { position: relative; min-height: 440px }
.map-wrap svg { width: 100%; height: 100%; display: block }
.land { fill: #52688c; stroke: #002257; stroke-width: .5 }
.land.has { fill: #7c8fb0 }
.bub { fill: var(--c); fill-opacity: .9; stroke: #fff; stroke-width: 1.2; cursor: pointer; transition: stroke-width .2s, fill-opacity .2s }
.bub:hover, .bub:focus-visible, .bub.on { stroke-width: 3; fill-opacity: 1; outline: none }
.map-tip { position: absolute; pointer-events: none; background: #fff; color: var(--navy); border-radius: 12px; padding: 8px 12px; font-size: .85rem; font-weight: 700; box-shadow: 0 12px 30px rgba(0, 34, 87, .25); opacity: 0; transition: opacity .15s; white-space: nowrap }
.map-tip.show { opacity: 1 }
.scroll-cue { display: block; text-align: center; padding: 0 0 20px; color: rgba(255, 255, 255, .7); font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-decoration: none }
.scroll-cue:hover { color: #fff }

/* Stories */
.stories { padding: 80px 0 96px }
.s-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px }
.s-head h2 { font-weight: 800; font-size: clamp(2.4rem, 5vw, 4.2rem); letter-spacing: -.04em; line-height: .95 }
.s-head p { margin: 0; color: var(--muted); max-width: 60ch }
.notice { background: var(--yellow); border-radius: 14px; padding: .7rem 1rem; font-weight: 700; margin: 0 0 22px }
.filters { background: var(--beige); border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 22px }
.frow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 170px; flex: 1 1 170px }
.field.search { flex: 3 1 320px }
.field label, .flabel { font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.field input, .field select { font: inherit; color: var(--navy); background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: .6rem .8rem; width: 100% }
.field input:focus, .field select:focus { border-color: var(--navy); outline: none }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.chips:empty { display: none }
.chip { font: inherit; font-size: .88rem; font-weight: 700; color: var(--navy); background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: .4rem .85rem; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem }
.chip:hover { border-color: var(--navy) }
.chip[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy) }
.chip .n { font-weight: 400; opacity: .7; font-variant-numeric: tabular-nums }
.chip.sub { font-size: .82rem; padding: .32rem .75rem; border-style: dashed }
.chip.sub[aria-pressed="true"] { background: var(--yellow); color: var(--navy); border-color: var(--yellow); border-style: solid }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px }
.count { font-family: var(--head); font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em }
.clear { font: inherit; font-weight: 700; font-size: .9rem; color: var(--blue); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 28px 0 }
.card { position: relative; background: var(--beige); border-radius: 22px; padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 10px; color: var(--navy); border: 1.5px solid transparent; transition: border-color .15s, transform .15s; overflow: hidden; text-align: left; font: inherit; cursor: pointer }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: var(--c) }
.card:hover { border-color: var(--navy); transform: translateY(-3px) }
.card img { width: calc(100% + 44px); margin: -26px -22px 4px; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #e6dfd2 }
.meta { display: flex; flex-wrap: wrap; gap: .4rem .8rem; font-weight: 700; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.card h3 { font-weight: 800; font-size: 1.4rem; letter-spacing: -.02em; line-height: 1.15; text-wrap: pretty }
.card p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.55 }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px }
.tag { font-size: .75rem; font-weight: 700; background: #fff; border-radius: 999px; padding: .2rem .6rem }
.more { margin-top: auto; padding-top: 6px; font-weight: 700; font-size: .9rem; color: var(--blue) }
.card.feat { grid-column: span 2 }
.more-wrap { display: flex; justify-content: center; margin-top: 28px }
.card.feat h3 { font-size: clamp(1.7rem, 2.6vw, 2.3rem) }

/* Story dialog */
dialog { border: 0; padding: 0; border-radius: 26px; width: min(780px, calc(100% - 32px)); max-height: calc(100% - 48px); color: var(--navy); box-shadow: 0 30px 80px rgba(0, 34, 87, .35) }
dialog::backdrop { background: rgba(0, 26, 69, .6) }
.dlg { position: relative; padding: 34px 36px 32px; display: flex; flex-direction: column; gap: 16px; --c: var(--yellow) }
.dlg::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: var(--c) }
.dlg h2 { font-weight: 800; font-size: clamp(1.8rem, 3.4vw, 2.6rem); letter-spacing: -.03em; line-height: 1.05; padding-right: 40px }
.dlg .story p { font-size: 1.08rem; line-height: 1.7; max-width: 65ch; margin: 0 0 1em }
.dlg .story p:last-child { margin: 0 }
.dlg blockquote { margin: 0; padding: .2rem 0 .2rem 1rem; border-left: 4px solid var(--c); font-family: var(--head); font-weight: 700; font-size: 1.25rem; line-height: 1.35 }
.dlg .note { background: var(--beige); border-radius: 12px; padding: .6rem .85rem; font-size: .88rem; color: var(--muted); margin: 0 }
.media { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.media img, .media iframe { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 0; border-radius: 14px; display: block; background: var(--beige) }
.dlg dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 4px 0 0; font-size: .92rem }
.dlg dt { font-weight: 700; color: var(--muted) }
.dlg dd { margin: 0 }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap }
.btn { font: inherit; font-weight: 700; border-radius: 12px; padding: .6rem 1rem; cursor: pointer; border: 1.5px solid var(--navy); background: #fff; color: var(--navy) }
.btn.primary { background: var(--navy); color: #fff }
.x { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); font-size: 1.2rem; cursor: pointer }

/* Footer (same as the CdeP site) */
.site-footer { position: relative; overflow: hidden; background: var(--navy); color: #fff; padding: 52px 32px 30px; border-top: 4px solid var(--coral) }
.site-footer::before { content: ""; position: absolute; top: -120px; right: -120px; width: 320px; height: 320px; background: radial-gradient(circle, rgba(252, 115, 102, .16) 0%, rgba(252, 115, 102, 0) 70%); pointer-events: none }
.f-in { position: relative; max-width: 1240px; margin: 0 auto }
.f-main { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 44px; padding-bottom: 38px; border-bottom: 1px solid rgba(255, 255, 255, .18) }
.f-logo { display: inline-block; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1) }
.f-logo:hover { transform: rotate(-3deg) scale(1.04) }
.f-logo img { height: 76px; width: 190px; object-fit: contain; display: block; margin-bottom: 32px }
.f-follow { font-size: 11.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--yellow); margin-bottom: 18px }
.f-soc { display: flex; gap: 10px }
.f-soc a { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22); color: rgba(255, 255, 255, .85); transition: transform .2s, background .2s, border-color .2s, color .2s }
.f-soc a:hover { background: var(--coral); border-color: var(--coral); color: #fff; transform: translateY(-3px) }
.f-soc svg { width: 15px; height: 15px }
.site-footer h3 { font-family: "League Gothic", sans-serif; font-weight: 400; font-size: 30px; line-height: 1; text-transform: uppercase; margin: 0 0 22px }
.site-footer p { font-size: 12.2px; line-height: 1.72; color: rgba(255, 255, 255, .78); margin: 0 0 18px; text-wrap: pretty }
.site-footer p:last-child { margin: 0 }
.f-bottom { padding-top: 28px; text-align: center; font-size: 13px; color: var(--yellow); font-weight: 700 }

@media (max-width: 1100px) {
  .hero-in { grid-template-columns: minmax(0, 1fr) }
  .map-wrap { min-height: 360px }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 760px) {
  .top-in { padding: 14px 18px }
  .cue-link, .lang-switch { display: none }
  .lang-select { display: block }
  .hero-in { padding: 96px 18px 40px }
  .map-wrap { min-height: 260px }
  .wrap { padding: 0 18px }
  .grid { grid-template-columns: minmax(0, 1fr) }
  .card.feat { grid-column: auto }
  .dlg { padding: 30px 22px 24px }
  .f-main { grid-template-columns: 1fr }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto }
  .card, .bub, .f-logo, .f-soc a { transition: none }
}
</style>

  const dn = {};
  const cname = (s) => {
    const own = fromSheet("countries:" + s.country);
    if (own) return own;
    if (!s.iso) return s.country;
    try { return (dn[lang] ||= new Intl.DisplayNames([HTMLLANG[lang]], { type: "region" })).of(s.iso); } catch (e) { return s.country; }
  };
  const txt = (s) => (s.t[lang] ? s.t[lang] : s.t.en);
  const subsOf = (s) => DIMS.flatMap((d) => s.themes[d] || []);

  /* ---------- Data ---------- */

  // Minimal CSV parser (quoted fields, commas and line breaks inside quotes).
  function parseCSV(text) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
        else if (c === '"') q = false;
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(f); rows.push(row); row = []; f = "";
      } else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows;
  }

  const clean = (v) => {
    v = (v || "").trim();
    return /^(#|Loading|Cargando)/i.test(v) ? "" : v; // skip formula errors and unfinished GOOGLETRANSLATE results
  };

  function toStories(rows) {
    const head = (rows[0] || []).map((h) => h.trim());
    // Google returns the first tab when the name in config.js does not exist: say so clearly instead of showing 0 stories.
    if (!head.some((h) => h.toLowerCase() === "story id")) throw new Error("tab");
    const col = (name) => head.findIndex((h) => h.toLowerCase().startsWith(name.toLowerCase()));
    const C = {
      id: col("Story ID"), status: col("Status"), pub: head.findIndex((h) => h.toLowerCase() === (CFG.publishColumn || "").toLowerCase()), year: head.findIndex((h) => h.toLowerCase() === "year"), date: col("Approved At"), country: col("Program Org Geo Country"), org: col("Program Org Name"),
      region: col("Region"), type: col("Story type"), title: col("Title (for web)"),
      story: col("Polished story"), quote: col("Highlight quote"), photo1: col("Photo 1"), photo2: col("Photo 2"), video: col("Video")
    };
    const dimCol = Object.fromEntries(DIMS.map((d) => [d, col(d)]));
    const langCol = Object.fromEntries(Object.entries(LCOL).map(([L, name]) => [L, [col("Title – " + name), col("Story – " + name)]]));
    const show = new Set(CFG.publish.concat(isPreview ? CFG.preview : []));
    const YES = /^(true|yes|y|s[ií]|x|1|✓|✔)$/i;
    usesColumn = C.pub > -1;
    // With the "Publish on web" column: ticked rows are public; in preview, rows not ticked are shown too.
    const visible = (r, status) => usesColumn ? YES.test(get(r, C.pub)) || (isPreview && !["No story", "Not for publication"].includes(status))
                                              : show.has(status);
    const get = (r, i) => (i > -1 ? clean(r[i]) : "");

    found = rows.slice(1).filter((r) => get(r, C.id) && get(r, C.title) && get(r, C.story)).length;
    return rows.slice(1).map((r) => {
      const s = { id: get(r, C.id), status: get(r, C.status), title: get(r, C.title), story: get(r, C.story) };
      if (!s.id || !s.title || !s.story || !visible(r, s.status)) return null;
      const c = COUNTRIES[get(r, C.country)] || [];
      const t = { en: { title: s.title, story: s.story } };
      for (const L in langCol) {
        const [ti, si] = langCol[L], title = get(r, ti), story = get(r, si);
        if (title && story) t[L] = { title, story };
      }
      const themes = {};
      DIMS.forEach((d) => { const v = get(r, dimCol[d]); if (v) themes[d] = v.split(/\s*,\s*/).filter(Boolean); });
      const year = ((get(r, C.year) || get(r, C.date)).match(/(?:19|20)\d{2}/) || [""])[0];
      return {
        id: s.id, t, themes, year, country: get(r, C.country), iso: c[0], num: c[1], ll: c[2], org: get(r, C.org),
        region: get(r, C.region) || "Global", type: get(r, C.type), quote: get(r, C.quote),
        photos: [get(r, C.photo1), get(r, C.photo2)].filter(Boolean), video: get(r, C.video)
      };
    }).filter(Boolean);
  }

  const sheetCSV = (name) =>
    fetch("https://docs.google.com/spreadsheets/d/" + CFG.sheetId + "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(name))
      .then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
      .then((txt) => { if (/^\s*</.test(txt)) throw new Error("private"); return parseCSV(txt); });
  const loadStories = () => sheetCSV(CFG.sheetName).then(toStories);

  // "Site texts" tab: one row per text, column "key" plus one column per language code (en, es, pt…).
  function loadTexts() {
    if (!CFG.textsSheet) return Promise.resolve({});
    return sheetCSV(CFG.textsSheet).then((rows) => {
      const head = rows[0].map((h) => h.trim().toLowerCase()), ki = head.indexOf("key"), out = {};
      if (ki < 0) return out;
      rows.slice(1).forEach((r) => {
        const k = (r[ki] || "").trim();
        if (!k) return;
        out[k] = {};
        LANGS.forEach((L) => { const i = head.indexOf(L), v = i > -1 ? (r[i] || "").trim() : ""; if (v) out[k][L] = v; });
      });
      return out;
    }).catch((e) => { console.warn("Site texts not loaded, using defaults", e); return {}; });
  }

  /* ---------- Media links ---------- */

  const driveId = (u) => (u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]+)/) || [])[1];
  const imgSrc = (u) => { const id = driveId(u); return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w1200" : u; };
  function videoEmbed(u) {
    const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
    if (yt) return "https://www.youtube-nocookie.com/embed/" + yt[1];
    const vm = u.match(/vimeo\.com\/(\d+)/);
    if (vm) return "https://player.vimeo.com/video/" + vm[1];
    const id = driveId(u);
    return id ? "https://drive.google.com/file/d/" + id + "/preview" : "";
  }

  /* ---------- Static texts and language ---------- */

  function applyStatic() {
    document.documentElement.lang = HTMLLANG[lang];
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $("q").placeholder = t("search");
    document.title = t("page_title");
    document.querySelector('meta[name="description"]').content = t("page_description");
    document.querySelectorAll("[data-href]").forEach((a) => { const u = t(a.dataset.href); if (u) a.href = u; a.hidden = !u; });
    $("preview").hidden = !isPreview;
    $("langs").innerHTML = LANGS.map((L) => `<button type="button" data-lang="${L}" lang="${HTMLLANG[L]}" title="${LNAME[L]}" aria-label="${LNAME[L]}" aria-pressed="${L === lang}">${L.toUpperCase()}</button>`).join("");
    $("lang-select").innerHTML = LANGS.map((L) => `<option value="${L}"${L === lang ? " selected" : ""}>${LNAME[L]}</option>`).join("");
  }

  function setLang(L) {
    lang = L;
    try { localStorage.setItem("stories-lang", L); } catch (e) {}
    applyStatic(); stats(); fillFilters(); render(true); labelBubbles();
    if (openId) openStory(openId, true);
  }

  function stats() {
    const uniq = (k) => new Set(D.map((s) => s[k])).size;
    // A number typed in "Site texts" (num_…) replaces the automatic count; an empty label hides the figure.
    $("stats").innerHTML = [["stories", D.length], ["countries", uniq("country")], ["orgs", uniq("org")], ["regions", uniq("region")]]
      .filter(([k]) => t("s_" + k))
      .map(([k, n]) => `<div class="stat"><b>${esc(t("num_" + k) || nf().format(n))}</b><span>${esc(t("s_" + k))}</span></div>`).join("");
  }

  /* ---------- Filters ---------- */

  function matches(s, skip) {
    for (const k of ["region", "country", "year", "type"]) if (skip !== k && st[k] && s[k] !== st[k]) return false;
    if (skip !== "dims" && st.dims.length && !st.dims.some((d) => s.themes[d])) return false;
    if (skip !== "subs" && st.subs.length && !st.subs.some((x) => subsOf(s).includes(x))) return false;
    if (st.q) {
      const x = txt(s), hay = [x.title, x.story, s.t.en.title, s.org, s.country, cname(s)].join(" ").toLowerCase();
      if (st.q.toLowerCase().split(/\s+/).some((w) => w && !hay.includes(w))) return false;
    }
    return true;
  }
  function countBy(skip, fn) {
    const m = {};
    D.filter((s) => matches(s, skip)).forEach((s) => [].concat(fn(s)).forEach((v) => { m[v] = (m[v] || 0) + 1; }));
    return m;
  }

  function fillFilters() {
    const byCountry = Object.fromEntries(D.map((s) => [s.country, s]));
    const defs = {
      region: ["all_regions", (v) => tx("regions", v), REGIONS],
      country: ["all_countries", (v) => cname(byCountry[v])],
      year: ["all_years", (v) => v, [...new Set(D.map((s) => s.year))].filter(Boolean).sort().reverse()],
      type: ["all_types", (v) => tx("types", v)]
    };
    for (const key in defs) {
      const [allKey, label, order] = defs[key], m = countBy(key, (s) => s[key]);
      let vals = order ? order.filter((v) => m[v]) : Object.keys(m).filter(Boolean).sort((a, b) => label(a).localeCompare(label(b), HTMLLANG[lang]));
      if (st[key] && !vals.includes(st[key])) vals.unshift(st[key]);
      $("f-" + key).innerHTML = `<option value="">${esc(t(allKey))}</option>` +
        vals.map((v) => `<option value="${esc(v)}"${st[key] === v ? " selected" : ""}>${esc(label(v))} (${m[v] || 0})</option>`).join("");
    }
    const dm = countBy("dims", (s) => Object.keys(s.themes));
    $("dims").innerHTML = DIMS.filter((d) => dm[d] || st.dims.includes(d))
      .map((d) => `<button type="button" class="chip" data-dim="${esc(d)}" aria-pressed="${st.dims.includes(d)}">${esc(tx("dims", d))} <span class="n">${dm[d] || 0}</span></button>`).join("");
    const sm = countBy("subs", subsOf);
    const subs = [...new Set(st.dims.flatMap((d) => D.flatMap((s) => s.themes[d] || [])))];
    $("subs").innerHTML = subs.map((x) => `<button type="button" class="chip sub" data-sub="${esc(x)}" aria-pressed="${st.subs.includes(x)}">${esc(tx("subs", x))} <span class="n">${sm[x] || 0}</span></button>`).join("");
  }

  /* ---------- Cards ---------- */

  function card(s, i) {
    const x = txt(s), first = x.story.split(/\n\s*\n/)[0];
    const ex = first.length > 200 ? first.slice(0, 195).replace(/\s+\S*$/, "") + "…" : first;
    const tags = subsOf(s).slice(0, 3).map((v) => `<span class="tag">${esc(tx("subs", v))}</span>`).join("");
    const img = s.photos[0] ? `<img src="${esc(imgSrc(s.photos[0]))}" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<button type="button" class="card${i === 0 ? " feat" : ""}" data-id="${esc(s.id)}" style="--c:${RCOL[s.region] || RCOL.Global}">${img}
      <span class="meta"><span>${esc(cname(s))}</span><span>${esc(tx("types", s.type))}</span>${s.year ? `<span>${s.year}</span>` : ""}</span>
      <h3>${esc(x.title)}</h3><p>${esc(ex)}</p><span class="tags">${tags}</span>
      <span class="more">${esc(t("read"))} →</span></button>`;
  }

  const PAGE = 24;
  let shown = PAGE;
  function render(keepPage) {
    if (!keepPage) shown = PAGE;
    const list = D.filter((s) => matches(s));
    $("count").textContent = nStories(list.length);
    const any = st.q || st.region || st.country || st.year || st.type || st.dims.length || st.subs.length;
    $("clear").style.visibility = any ? "visible" : "hidden";
    $("grid").innerHTML = list.length ? list.slice(0, shown).map(card).join("") : `<p class="empty">${esc(t("none"))}</p>`;
    $("more").hidden = list.length <= shown;
    if (window.d3) d3.selectAll(".bub").classed("on", (p) => st.country === p.country);
  }

  /* ---------- Story dialog ---------- */

  let openId = null, lastFocus = null;
  function openStory(id, keep) {
    const s = D.find((o) => o.id === id);
    if (!s) return;
    openId = id;
    const x = txt(s), translated = lang === "en" || !!s.t[lang];
    const themes = DIMS.filter((d) => s.themes[d]).map((d) => tx("dims", d) + ": " + s.themes[d].map((v) => tx("subs", v)).join(", ")).join(" · ");
    const paras = x.story.split(/\n\s*\n/).map((p) => `<p>${esc(p.trim())}</p>`).join("");
    const emb = s.video ? videoEmbed(s.video) : "";
    const media = s.photos.map((p) => `<img src="${esc(imgSrc(p))}" alt="${esc(t("photo"))}" loading="lazy" onerror="this.remove()">`).join("") +
      (emb ? `<iframe src="${esc(emb)}" title="${esc(t("watch"))}" allow="fullscreen; picture-in-picture" loading="lazy"></iframe>` : "");
    const body = $("dlg-body");
    body.style.setProperty("--c", RCOL[s.region] || RCOL.Global);
    body.innerHTML = `<button class="x" type="button" data-close aria-label="${esc(t("close"))}">×</button>
      <span class="meta">${esc(cname(s))} · ${esc(tx("regions", s.region))} · ${esc(tx("types", s.type))}</span>
      <h2 id="dlg-title">${esc(x.title)}</h2>
      ${translated ? "" : `<p class="note">${esc(t("fallback"))}</p>`}
      ${media ? `<div class="media">${media}</div>` : ""}
      ${s.quote && lang === "en" ? `<blockquote>${esc(s.quote)}</blockquote>` : ""}
      <div class="story" lang="${translated ? HTMLLANG[lang] : "en"}">${paras}</div>
      ${s.video && !emb ? `<p><a href="${esc(s.video)}" target="_blank" rel="noopener">${esc(t("watch"))} ↗</a></p>` : ""}
      <dl><dt>${esc(t("partner"))}</dt><dd>${esc(s.org)}</dd>${s.year ? `<dt>${esc(t("f_year"))}</dt><dd>${s.year}</dd>` : ""}${themes ? `<dt>${esc(t("themes"))}</dt><dd>${esc(themes)}</dd>` : ""}</dl>
      <div class="actions"><button class="btn" type="button" id="share">${esc(t("share"))}</button><button class="btn primary" type="button" data-close>${esc(t("close"))}</button></div>`;
    $("share").onclick = (e) => {
      const b = e.currentTarget, url = location.href.split("#")[0] + "#story-" + s.id;
      navigator.clipboard?.writeText(url).then(() => { b.textContent = t("copied"); }, () => { b.textContent = url; });
    };
    if (!keep) {
      lastFocus = document.activeElement;
      if (!$("dlg").open) $("dlg").showModal();
      history.replaceState(null, "", "#story-" + s.id);
    }
  }

  /* ---------- Map ---------- */

  function drawMap(world) {
    const W = 900, H = 470, svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
    const land = topojson.feature(world, world.objects.countries);
    land.features = land.features.filter((f) => f.properties.name !== "Antarctica");
    const proj = d3.geoNaturalEarth1().fitExtent([[8, 8], [W - 8, H - 8]], land), path = d3.geoPath(proj);
    const nums = new Set(D.map((s) => s.num));
    svg.append("g").selectAll("path").data(land.features).join("path").attr("d", path).attr("class", (f) => "land" + (nums.has(f.id) ? " has" : ""));

    const by = {};
    D.forEach((s) => { if (s.num) (by[s.country] ||= { ...s, n: 0 }).n++; });
    const pts = Object.values(by).map((p) => {
      const f = land.features.find((x) => x.id === p.num), ll = p.ll || (f && d3.geoCentroid(f));
      return { ...p, xy: ll && proj(ll) };
    }).filter((p) => p.xy).sort((a, b) => b.n - a.n);
    const r = d3.scaleSqrt().domain([1, d3.max(pts, (p) => p.n) || 1]).range([6, 26]);
    const tip = $("tip"), wrap = $("map-wrap");

    svg.append("g").selectAll("circle").data(pts).join("circle")
      .attr("class", "bub").attr("cx", (p) => p.xy[0]).attr("cy", (p) => p.xy[1]).attr("r", (p) => r(p.n))
      .style("--c", (p) => RCOL[p.region] || RCOL.Global).attr("tabindex", 0).attr("role", "button")
      .on("mouseenter focus", function (ev, p) {
        const b = wrap.getBoundingClientRect(), c = this.getBoundingClientRect();
        tip.textContent = cname(p) + " · " + nStories(p.n);
        tip.style.left = c.left - b.left + c.width / 2 - tip.offsetWidth / 2 + "px";
        tip.style.top = c.top - b.top - 40 + "px";
        tip.classList.add("show");
      })
      .on("mouseleave blur", () => tip.classList.remove("show"))
      .on("click keydown", (ev, p) => {
        if (ev.type === "keydown" && ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault();
        st.country = st.country === p.country ? "" : p.country; st.region = "";
        fillFilters(); render(); $("stories").scrollIntoView();
      });
    labelBubbles();
  }
  const labelBubbles = () => window.d3 && d3.selectAll(".bub").attr("aria-label", (p) => cname(p) + ": " + nStories(p.n));

  /* ---------- Events ---------- */

  $("langs").addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
  $("lang-select").addEventListener("change", (e) => setLang(e.target.value));
  $("grid").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openStory(c.dataset.id); });
  $("dims").addEventListener("click", (e) => {
    const b = e.target.closest("[data-dim]"); if (!b) return;
    const d = b.dataset.dim;
    st.dims = st.dims.includes(d) ? st.dims.filter((x) => x !== d) : st.dims.concat(d);
    const allowed = new Set(st.dims.flatMap((dd) => D.flatMap((s) => s.themes[dd] || [])));
    st.subs = st.subs.filter((x) => allowed.has(x));
    fillFilters(); render();
  });
  $("subs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sub]"); if (!b) return;
    const x = b.dataset.sub;
    st.subs = st.subs.includes(x) ? st.subs.filter((v) => v !== x) : st.subs.concat(x);
    fillFilters(); render();
  });
  document.querySelectorAll("select[data-key]").forEach((el) => el.addEventListener("change", () => {
    st[el.dataset.key] = el.value;
    if (el.dataset.key === "region") st.country = "";
    fillFilters(); render();
  }));
  let qt;
  $("q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value.trim(); fillFilters(); render(); }, 150); });
  $("more").addEventListener("click", () => { shown += PAGE; render(true); });
  $("clear").addEventListener("click", () => { st = empty(); $("q").value = ""; fillFilters(); render(); });
  $("dlg").addEventListener("click", (e) => { if (e.target === $("dlg") || e.target.closest("[data-close]")) $("dlg").close(); });
  $("dlg").addEventListener("close", () => { openId = null; history.replaceState(null, "", location.pathname + location.search); lastFocus?.focus(); });
  const route = () => { if (location.hash.startsWith("#story-")) openStory(location.hash.slice(7)); };
  window.addEventListener("hashchange", route);

  /* ---------- Start ---------- */

  applyStatic();
  Promise.all([loadStories(), loadTexts(), fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then((r) => r.json()).catch(() => null)])
    .then(([stories, texts, world]) => {
      D = stories; SHEET = texts;
      applyStatic();
      stats(); fillFilters(); render();
      if (!D.length && found) $("grid").innerHTML = `<p class="empty">La web está conectada a la hoja: encontró ${found} historias con título y texto, pero ${usesColumn ? `ninguna está marcada en la columna "${CFG.publishColumn}"` : `ninguna tiene Status ${CFG.publish.map((x) => `"${x}"`).join(" o ")}`}. Marcalas en la pestaña "${CFG.sheetName}", o agregá <b>?preview</b> al final de la dirección para verlas antes de publicarlas.</p>`;
      try { if (world && window.d3 && window.topojson) drawMap(world); else $("map-wrap").hidden = true; } catch (e) { $("map-wrap").hidden = true; console.warn(e); }
      route();
    })
    .catch((e) => {
      const msg = {
        tab: `No se encontró la pestaña de historias "${CFG.sheetName}" en el spreadsheet. Revisá el nombre en la configuración al inicio de index.html.`,
        private: `Google no deja leer la hoja. Compartila como "Cualquier persona con el vínculo: Lector" (botón Compartir).`
      }[e.message] || t("error") + " (" + e.message + ")";
      $("grid").innerHTML = `<p class="empty">${esc(msg)}</p>`; console.warn(e);
    });
})();
</script>
</body>
</html>
